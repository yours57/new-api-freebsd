name: Build new-api

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build new-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone Repo
        run: |
          export LATEST_APP=$(wget -qO- https://api.github.com/repos/QuantumNous/new-api/tags | gawk -F '["v]' '/name/{print "v"$5;exit}')
          echo "Latest new-api tag: $LATEST_APP"
          git clone -b $LATEST_APP https://github.com/QuantumNous/new-api

      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd new-api

          VERSION=$(git describe --tags --always)
          echo "Build frontend version: $VERSION"

          echo "Building default frontend..."
          cd web/default
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..

          echo "Building classic frontend..."
          cd web/classic
          bun install
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ../..

      - name: Build Backend
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: 13.2
          prepare: |
            pkg install -y jq wget curl git gcc bash gawk gsed
            wget https://dl.google.com/go/go1.23.4.freebsd-amd64.tar.gz
            tar -C /usr/local -xzf go1.23.4.freebsd-amd64.tar.gz
            rm go1.23.4.freebsd-amd64.tar.gz
            ln -s /usr/local/go/bin/go /usr/local/bin/go
          run: |
            git config --global --add safe.directory /home/runner/work/new-api-freebsd/new-api-freebsd/new-api

            cd new-api

            VERSION=$(git describe --tags --always)
            echo "Build backend version: $VERSION"

            go mod download

            go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o new-api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-freebsd
          path: |
            new-api/new-api

      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=$(wget -qO- https://api.github.com/repos/QuantumNous/new-api/tags | gawk -F '["v]' '/name/{print "v"$5;exit}')" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: |
            new-api/new-api

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 8
